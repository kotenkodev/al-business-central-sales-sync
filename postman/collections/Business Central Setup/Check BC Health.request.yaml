$kind: http-request
name: Check BC Health
method: GET
order: 2000
url: '{{base_url}}/v2.0/companies?tenant={{tenant_id}}'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{username}}'
    - key: password
      value: '{{password}}'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("BC is reachable", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has companies", function () {
          const res = pm.response.json();
          pm.expect(res.value).to.be.an("array");
      });
